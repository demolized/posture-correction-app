name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: npm run build
        env:
          CI: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor with Android
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: posture-correction-app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: Posture Correction App ${{ github.ref_name }}
          body: |
            ## Posture Correction App ${{ github.ref_name }}

            ### Installation
            1. Download the APK file below
            2. Enable "Install from unknown sources" in Android settings
            3. Install the APK and launch the app

            ### Features
            - **Assessment Tab**: Posture analysis and recommendations
            - **Exercises Tab**: 9 exercises with built-in timers
            - **Progress Tab**: Visual progress tracking
            - **Offline Support**: Works without internet connection

            ### Requirements
            - Android 5.0 (API 21) or higher
            - ~50MB free storage

            ### Links
            - Web version: https://demolized.github.io/posture-correction-app
            - Report issues: https://github.com/demolized/posture-correction-app/issues
          draft: false
          prerelease: false
