name: Build Android APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  build-android:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build web app
      run: npm run build
      
    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '11'
        
    - name: Set up Android SDK
      uses: android-actions/setup-android@v0
      
    - name: Add Android platform
      run: npx cap add android
      
    - name: Sync with Android
      run: npx cap sync android
      
    - name: Build Android APK
      run: |
        cd android
        ./gradlew assembleDebug
        cd ..
        
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: posture-correction-app
        path: android/app/build/outputs/apk/debug/app-debug.apk
        
    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v1
      with:
        files: android/app/build/outputs/apk/debug/app-debug.apk
        name: Posture Correction App ${{ github.ref_name }}
        body: |
          ## Posture Correction App ${{ github.ref_name }}
          
          ### What's New
          - Comprehensive posture assessment
          - Interactive exercise routines
          - Progress tracking
          - Mobile-optimized interface
          
          ### Installation
          1. Download the APK file
          2. Enable "Install from unknown sources" in Android settings
          3. Install the APK
          4. Launch the app
          
          ### Features
          - **Assessment Tab**: Posture analysis and recommendations
          - **Exercises Tab**: 9 exercises with built-in timers
          - **Progress Tab**: Visual progress tracking
          - **Offline Support**: Works without internet connection
          
          ### System Requirements
          - Android 5.0 (API level 21) or higher
          - 50MB free storage space
          - Internet connection for initial setup
          
          ### Support
          - Report issues: [GitHub Issues](https://github.com/demolized/posture-correction-app/issues)
          - Web version: [GitHub Pages](https://demolized.github.io/posture-correction-app)
          
        draft: false
        prerelease: false
